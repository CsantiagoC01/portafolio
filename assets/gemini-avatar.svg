<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Santiago Carmona avatar">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1f38"/>
      <stop offset="100%" stop-color="#0a1a2d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0%" stop-color="#8ce4ff"/>
      <stop offset="100%" stop-color="#6cc9f5"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" x2="1">
      <stop offset="0%" stop-color="#59687a"/>
      <stop offset="100%" stop-color="#2b3749"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#13263f"/>
      <stop offset="100%" stop-color="#0f1d30"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7d8b1"/>
      <stop offset="100%" stop-color="#e5b68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06131d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="400" cy="400" r="355" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="330" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <!-- laptop / monitor on left -->
  <g filter="url(#shadow)">
    <rect x="158" y="286" width="205" height="142" rx="12" fill="url(#screen)" stroke="#6ad4ff" stroke-width="6"/>
    <line x1="150" y1="430" x2="365" y2="430" stroke="#0a233a" stroke-width="12" stroke-linecap="round"/>
    <line x1="251" y1="430" x2="251" y2="458" stroke="#0a233a" stroke-width="10" stroke-linecap="round"/>

    <g fill="none" stroke-linecap="round">
      <path d="M180 320 L240 320" stroke="#6ee7b7" stroke-width="8"/>
      <path d="M180 342 L222 342" stroke="#7dd3fc" stroke-width="8"/>
      <path d="M180 364 L258 364" stroke="#f9a8d4" stroke-width="8"/>
      <path d="M180 386 L228 386" stroke="#c4b5fd" stroke-width="8"/>
      <path d="M245 320 L308 320" stroke="#8be9d9" stroke-width="8"/>
      <path d="M244 342 L320 342" stroke="#4cc9f0" stroke-width="8"/>
      <path d="M244 364 L300 364" stroke="#fb7185" stroke-width="8"/>
      <path d="M244 386 L314 386" stroke="#fbbf24" stroke-width="8"/>
    </g>
  </g>

  <!-- hoodie body -->
  <g filter="url(#shadow)">
    <path d="M270 505 L520 505 L560 690 L216 690 Z" fill="url(#hoodie)"/>
    <path d="M310 500 L380 470 L430 500 L530 500 L557 690 L244 690 L270 500 Z" fill="#2a374a" opacity="0.7"/>
    <path d="M300 490 L270 420 L350 470 L380 510 L320 540 Z" fill="#37465d"/>
    <path d="M500 490 L530 420 L450 470 L420 510 L480 540 Z" fill="#37465d"/>
    <path d="M318 510 L400 480 L482 510 L470 690 L330 690 Z" fill="#1f2a38" opacity="0.5"/>
    <path d="M327 520 L400 497 L473 520 L456 690 L345 690 Z" fill="#232c3d" opacity="0.45"/>
  </g>

  <!-- head and face -->
  <g filter="url(#shadow)">
    <!-- hair -->
    <path d="M296 245 Q400 166 504 246 L500 310 Q400 285 300 310 Z" fill="#6f3e23"/>
    <path d="M288 245 C320 170 360 142 400 142 C450 142 485 180 513 246" fill="none" stroke="#5f341d" stroke-width="18" stroke-linecap="round"/>
    <path d="M300 266 Q360 210 430 206 Q470 210 490 232 L500 292 Q390 314 300 290 Z" fill="#7b452a"/>

    <!-- face -->
    <ellipse cx="400" cy="350" rx="150" ry="170" fill="url(#skin)"/>

    <!-- ear -->
    <ellipse cx="262" cy="350" rx="21" ry="30" fill="#e4b58b"/>
    <ellipse cx="538" cy="350" rx="21" ry="30" fill="#e4b58b"/>

    <!-- glasses -->
    <circle cx="330" cy="347" r="42" fill="none" stroke="#23252d" stroke-width="12"/>
    <circle cx="470" cy="347" r="42" fill="none" stroke="#23252d" stroke-width="12"/>
    <path d="M370 347 H432" stroke="#23252d" stroke-width="10" stroke-linecap="round"/>
    <path d="M270 355 Q318 340 330 347" fill="none" stroke="#2d2d2d" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 355 Q470 340 470 347" fill="none" stroke="#2d2d2d" stroke-width="10" stroke-linecap="round"/>

    <!-- eyes -->
    <circle cx="330" cy="347" r="9" fill="#1d242c"/>
    <circle cx="470" cy="347" r="9" fill="#1d242c"/>
    <circle cx="333" cy="344" r="3" fill="#fff"/>
    <circle cx="473" cy="344" r="3" fill="#fff"/>

    <!-- mouth/smile -->
    <path d="M330 430 Q400 485 470 430" stroke="#ad5a40" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M358 441 Q400 468 442 441" stroke="#f9d0a6" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M400 336 L400 398" stroke="#d9a37d" stroke-width="7" stroke-linecap="round"/>
    <path d="M400 365 Q389 378 383 392" stroke="#d9a37d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M400 365 Q411 378 417 392" stroke="#d9a37d" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- cheeks -->
    <circle cx="292" cy="389" r="17" fill="#f7b5aa" opacity="0.5"/>
    <circle cx="508" cy="389" r="17" fill="#f7b5aa" opacity="0.5"/>
  </g>

  <!-- headphones -->
  <g>
    <path d="M282 460 C278 535 294 588 332 610" fill="none" stroke="#1a2333" stroke-width="10" stroke-linecap="round"/>
    <path d="M518 460 C522 535 506 588 468 610" fill="none" stroke="#1a2333" stroke-width="10" stroke-linecap="round"/>
    <rect x="297" y="458" width="24" height="110" rx="12" fill="#1c2330"/>
    <rect x="479" y="458" width="24" height="110" rx="12" fill="#1c2330"/>
  </g>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <path d="M276 543 Q400 595 524 543 L520 644 Q400 674 280 644 Z" fill="#cacfd7"/>
    <path d="M300 560 Q400 603 500 560" fill="none" stroke="#8b9099" stroke-width="8" stroke-linecap="round"/>
    <path d="M278 638 L522 638 L548 684 L252 684 Z" fill="#d5d8de"/>
    <path d="M290 648 H510" stroke="#a0a6af" stroke-width="10" stroke-linecap="round"/>
    <path d="M265 680 H535" stroke="#a09ea3" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- JS badge -->
  <g filter="url(#shadow)">
    <rect x="500" y="537" width="120" height="120" rx="18" fill="#f6d628"/>
    <text x="560" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#1f2937">JS</text>
    <circle cx="541" cy="620" r="8" fill="#1f2937"/>
    <path d="M541 620 L583 620" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
    <circle cx="583" cy="620" r="8" fill="#1f2937"/>
  </g>

  <!-- code tag sticker -->
  <g filter="url(#shadow)">
    <rect x="508" y="671" width="134" height="86" rx="18" fill="#f1f5f9" opacity="0.95"/>
    <text x="575" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#2f2f2f">&lt;/&gt;</text>
    <text x="575" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f2f2f">Hello</text>
    <text x="575" y="758" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f2f2f">World</text>
  </g>
</svg>
